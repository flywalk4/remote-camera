# Generate the Xcode project:  brew install xcodegen && xcodegen
name: RemoteCamera
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    # iOS 15 = iPhone 6s / SE (1st gen) and every newer iPhone.
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RemoteCamera:
    type: application
    platform: iOS
    sources:
      - path: RemoteCamera
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        # Replace with your own unique identifier if Xcode complains during signing.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.remotecamera
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Pick your team (Apple ID) in Xcode: Signing & Capabilities → Team.
        DEVELOPMENT_TEAM: ""
    info:
      path: RemoteCamera/Info.plist
      properties:
        CFBundleDisplayName: Remote Camera
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        # Portrait UI only: the on-screen preview layer does not rotate with the interface,
        # so a landscape UI would show the camera image sideways.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: The camera is used to take photos and show a live preview on the Mac remote.
        NSPhotoLibraryAddUsageDescription: Used to save photos to the Photos library when that option is enabled.
        NSLocalNetworkUsageDescription: The Mac remote connects to the iPhone over the local network.
        NSBonjourServices:
          - _http._tcp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
