# Генерация Xcode-проекта:  brew install xcodegen && xcodegen
name: RemoteCamera
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RemoteCamera:
    type: application
    platform: iOS
    sources:
      - path: RemoteCamera
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        # Замените на свой уникальный идентификатор, если Xcode ругается при подписи.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.remotecamera
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Команду (Apple ID) удобнее выбрать в Xcode: Signing & Capabilities → Team.
        DEVELOPMENT_TEAM: ""
    info:
      path: RemoteCamera/Info.plist
      properties:
        CFBundleDisplayName: Remote Camera
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Камера нужна, чтобы снимать и показывать превью на пульте Mac.
        NSPhotoLibraryAddUsageDescription: Чтобы сохранять снимки в «Фото», если включена эта опция.
        NSLocalNetworkUsageDescription: Пульт на Mac подключается к iPhone по локальной сети.
        NSBonjourServices:
          - _http._tcp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
