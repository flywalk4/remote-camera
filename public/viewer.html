<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remote Camera — пульт</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="viewer">
  <main class="stage" id="stage">
    <video id="remote" autoplay playsinline muted></video>
    <div class="grid-overlay" id="gridOverlay"></div>
    <div class="countdown" id="countdown"></div>
    <div class="placeholder" id="placeholder">
      <h2>Ожидание iPhone…</h2>
      <p>Откройте на iPhone адрес из терминала (или отсканируйте QR-код) и нажмите «Включить камеру».</p>
      <p class="mono" id="phoneUrl"></p>
    </div>
    <div class="hud">
      <span id="connState" class="pill">нет связи</span>
      <span id="videoInfo" class="pill"></span>
      <span id="recTimer" class="pill rec" hidden>● 00:00</span>
    </div>
    <div class="toast" id="toast"></div>
  </main>

  <aside class="panel">
    <section class="shutter-row">
      <button id="photoBtn" class="shutter" title="Фото (Пробел)" disabled></button>
      <button id="recordBtn" class="record" title="Запись (R)" disabled><span></span></button>
    </section>

    <section>
      <label>Таймер фото
        <select id="timer">
          <option value="0">Выкл</option>
          <option value="3">3 с</option>
          <option value="10">10 с</option>
        </select>
      </label>
    </section>

    <section>
      <button id="switchBtn" class="wide" disabled>🔄 Сменить камеру <kbd>C</kbd></button>
    </section>

    <section id="zoomSection" hidden>
      <label>Зум <output id="zoomValue">1.0×</output>
        <input type="range" id="zoom" min="1" max="1" step="0.1" value="1">
      </label>
    </section>

    <section id="torchSection" hidden>
      <label class="check"><input type="checkbox" id="torch"> 🔦 Фонарик</label>
    </section>

    <section>
      <label>Качество видео
        <select id="resolution" disabled>
          <option value="720p">720p</option>
          <option value="1080p" selected>1080p</option>
          <option value="4k">4K</option>
        </select>
      </label>
    </section>

    <section class="toggles">
      <label class="check"><input type="checkbox" id="grid"> Сетка <kbd>G</kbd></label>
      <label class="check"><input type="checkbox" id="mirror"> Зеркально</label>
      <label class="check"><input type="checkbox" id="autosave" checked> Сразу сохранять в «Загрузки»</label>
      <button id="fullscreenBtn" class="wide">⛶ Полный экран <kbd>F</kbd></button>
    </section>

    <section class="gallery-section">
      <h3>Снимки и видео</h3>
      <div id="transfer" class="transfer" hidden>
        <span id="transferName"></span>
        <progress id="transferProgress" max="1" value="0"></progress>
      </div>
      <div id="gallery" class="gallery"></div>
    </section>
  </aside>

  <script src="common.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
