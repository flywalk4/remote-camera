<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Remote Camera — iPhone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="phone">
  <video id="preview" autoplay playsinline muted></video>

  <div class="phone-overlay">
    <div class="phone-top">
      <span class="rec-dot">● REC</span>
      <span id="status">Подключение к серверу…</span>
    </div>

    <div class="phone-start">
      <h1>📷 Remote Camera</h1>
      <p>Этот iPhone станет камерой, которой управляют с Mac.</p>
      <label class="check"><input type="checkbox" id="audio" checked> Записывать звук с микрофона</label>
      <button id="start" class="big">Включить камеру</button>
      <p class="hint">Совет: поставьте телефон на штатив и не блокируйте экран — Safari отключает камеру в фоне.</p>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="phone.js"></script>
</body>
</html>
